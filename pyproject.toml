[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moth-security"
version = "0.2.1"
description = "Native desktop website security assessment with understandable findings"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.gui-scripts]
moth = "moth.desktop:run"

[tool.setuptools.packages.find]
include = ["moth*"]

[tool.setuptools.package-data]
moth = ["resources/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
